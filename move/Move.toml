[package]
name = "suisure"
edition = "2024.beta"

[dependencies]
# The Sui framework is supplied implicitly by the CLI and is deliberately not
# pinned here; Move.lock records the resolved revision. payment_kit lives at the
# root of its repo, so there is no subdir, and is pinned to an exact rev rather
# than a branch so the build is reproducible.
payment_kit = { git = "https://github.com/MystenLabs/sui-payment-kit.git", rev = "34464974de849975872cc67f02715a98db3112ba" }

# There is deliberately no [addresses] section. payment_kit's own manifest
# declares payment_kit = "0x0" and records no published address anywhere, so
# `sui client publish` reports it as an unpublished dependency and refuses --
# forcing it through with --with-unpublished-dependencies would deploy a second
# copy of payment_kit, leaving this module calling a package that the canonical
# Namespace and PaymentRegistry know nothing about.
#
# Both `sui client publish` and `sui client upgrade` resolve it correctly on
# their own. Verified on a wiped build directory: the dependency list comes back
# as 0x1, 0x2 and 0x7e069abe..1497, the canonical deployed payment_kit, with no
# duplicate. Only `sui client test-publish` refuses, which is a limitation of
# that subcommand.
#
# Prefer upgrades where possible, since they preserve the package ID and the
# registered merchant credentials. Adding a field to an existing struct is not
# upgrade-compatible and forces a republish, which orphans both.
#
# Adding an [addresses] section switches the whole file to the legacy manifest
# parser, where the modern [dep-replacements] section is silently ignored.
